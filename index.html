<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#F6F7FB" />
    <title>LINK — Meet IRL. Stay connected.</title>
    <style>
      html, body { margin: 0; min-height: 100%; background: #F6F7FB; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      main { min-height: 100vh; display: grid; place-items: center; padding: 32px; box-sizing: border-box; }
      .card { width: min(560px, 100%); background: #fff; border: 1px solid #e8eaf0; border-radius: 28px; padding: 32px; box-sizing: border-box; box-shadow: 0 18px 50px rgba(17,19,24,.08); }
      .logo { width: 52px; height: 52px; border-radius: 16px; display: grid; place-items: center; background: #111318; color: #fff; font-weight: 800; font-size: 22px; }
      h1 { font-size: 36px; letter-spacing: -1.6px; margin: 22px 0 10px; color: #111318; }
      p { color: #6f7582; line-height: 1.55; margin: 0; }
      code { background: #f0f1f6; padding: 3px 7px; border-radius: 7px; color: #111318; }
    </style>
  </head>
  <body>
    <main>
      <section class="card">
        <div class="logo">L</div>
        <h1>LINK</h1>
        <p>This repository contains an Expo app. GitHub Pages is deployed from the generated <code>dist/index.html</code> via the included GitHub Actions workflow.</p>
      </section>
    </main>
  </body>
</html>
